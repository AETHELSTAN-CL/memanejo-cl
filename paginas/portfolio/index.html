<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scroll Fluido 3D</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-movimiento"></div>

<div class="paneles">
  <!-- Sección 1 -->
  <section class="seccion uno">
    <div class="objeto-central">
      <div class="cubo"></div>
      <h1 class="titulo">Bienvenido</h1>
    </div>
    <div class="figuras-flotantes">
      <div class="figura esfera" style="left:10%; top:20%;"></div>
      <div class="figura tetraedro" style="left:70%; top:60%;"></div>
      <div class="figura cubo-pequeno" style="left:50%; top:40%;"></div>
    </div>
  </section>

  <!-- Sección 2 -->
  <section class="seccion dos">
    <h1>Un Nuevo Camino</h1>
    <div class="figuras-flotantes">
      <div class="figura cubo-pequeno" style="left:30%; top:20%;"></div>
      <div class="figura esfera" style="left:60%; top:50%;"></div>
    </div>
  </section>

  <!-- Sección 3 -->
  <section class="seccion tres">
    <button class="boton-llamado contacto">Contáctame</button>
  </section>
</div>

<script src="script.js"></script>
</body>
</html>
